<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Music note -->
  <g fill="white" opacity="0.95">
    <!-- Stem -->
    <rect x="210" y="120" width="40" height="220" rx="20"/>
    <!-- Flag / beam -->
    <path d="M250 120 Q380 100 380 200 Q380 240 340 250 L250 260 Z" opacity="0.9"/>
    <!-- Note head 1 -->
    <ellipse cx="198" cy="330" rx="55" ry="40" transform="rotate(-15 198 330)"/>
    <!-- Note head 2 -->
    <rect x="250" y="200" width="40" height="160" rx="20"/>
    <ellipse cx="318" cy="355" rx="55" ry="40" transform="rotate(-15 318 355)"/>
  </g>
</svg>
