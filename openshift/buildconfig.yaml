apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: melody
spec:
  source:
    type: Git
    git:
      uri: https://github.com/0xAre/melody.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: melody:latest
  triggers:
    - type: ConfigChange
